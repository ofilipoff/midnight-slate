name: Test Entra Federation

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Verify Entra authentication
    runs-on: ubuntu-latest

    steps:
      - name: Sign in to Microsoft Entra
        uses: azure/login@v3
        with:
          client-id: ${{ vars.ENTRA_CLIENT_ID }}
          tenant-id: ${{ vars.ENTRA_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Verify authenticated identity
        run: |
          az account show \
            --query "{tenant:tenantId, identity:user.name, type:user.type}" \
            --output json
